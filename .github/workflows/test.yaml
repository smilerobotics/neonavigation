name: build
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ROS_DISTRO: humble
          # jazzy can be enabled here once the packages support it:
          # - ROS_DISTRO: jazzy
    env:
      ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
      ROS_REPO: main
      UPSTREAM_WORKSPACE: .github/upstream.repos
      ROSDEP_SKIP_KEYS: ament_auto_cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: industrial_ci
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          ROS_REPO: main
          UPSTREAM_WORKSPACE: .github/upstream.repos
          ROSDEP_SKIP_KEYS: ament_auto_cmake

  report-log:
    needs: build
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Post failing build log to PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id });
            const job = jobs.find(j => j.name && j.name.startsWith('build') && j.conclusion === 'failure');
            if (!job) { core.info('no failed build job found'); return; }
            const res = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: job.id });
            let log = Buffer.isBuffer(res.data) ? res.data.toString('utf8') : String(res.data);
            const MAX = 60000;
            if (log.length > MAX) log = '...(truncated to last ' + MAX + ' chars)...\n' + log.slice(-MAX);
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: '### industrial_ci failing log (job ' + job.id + ' — ' + job.name + ')\n<details><summary>log tail</summary>\n\n```\n' + log + '\n```\n</details>'
            });
