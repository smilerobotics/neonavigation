name: build
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ROS_DISTRO: humble
          # jazzy can be enabled here once the packages support it:
          # - ROS_DISTRO: jazzy
    env:
      ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
      ROS_REPO: main
      UPSTREAM_WORKSPACE: .github/upstream.repos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: industrial_ci
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          ROS_REPO: main
          UPSTREAM_WORKSPACE: .github/upstream.repos
